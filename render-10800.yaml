services:
  - type: web
    name: python-server-10800
    runtime: docker
    plan: 8c-32g
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: ./run_setup.sh
    disk:
      name: app-data-10800
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: SLEEP_SECONDS
        value: "10800"
      - key: PORT
        value: "8000"
